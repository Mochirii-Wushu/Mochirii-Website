name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.4

      - name: Verify Deno release checksum
        env:
          DENO_BINARY_SHA256: 1d97ecaf9e6bbb2a99e991caaf64ba9d62bf98759e8ef9938b9005855772b017
        shell: bash
        run: |
          set -Eeuo pipefail
          deno_path="$(command -v deno)"
          printf '%s  %s\n' "$DENO_BINARY_SHA256" "$deno_path" | sha256sum --check --strict -
          deno --version | grep -F 'deno 2.9.4'

      - name: Install dependencies
        run: npm ci

      - name: Run validation
        run: npm run check

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_SHA}" "${HEAD_SHA}"
          git diff --check "${BASE_SHA}" "${HEAD_SHA}"
