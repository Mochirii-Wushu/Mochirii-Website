name: Validate Next app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-next:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check local toolchain contract
        run: npm run toolchain:check

      - name: Lint
        run: npm run lint

      - name: Test private spinner media
        run: npm run test:spinner-private

      - name: Test private raffle leaderboard contract
        run: npm run test:raffle-leaderboard

      - name: Build
        run: npm run build

      - name: Check client bundle budgets
        run: npm run check:client-bundle

      - name: Check local font bundle
        run: npm run check:font-bundle

      - name: Check route CSS delivery
        run: npm run check:route-css-bundle
