name: Validate Next app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-next:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install browser test tooling
        working-directory: .
        run: npm ci

      - name: Check local toolchain contract
        run: npm run toolchain:check

      - name: Lint
        run: npm run lint

      - name: Test private spinner media
        run: npm run test:spinner-private

      - name: Test public runtime and schedule boundaries
        run: npm run test:web-runtime-performance

      - name: Build
        run: npm run build

      - name: Check client bundle budgets
        run: npm run check:client-bundle

      - name: Check local font bundle
        run: npm run check:font-bundle

      - name: Check route CSS delivery
        run: npm run check:route-css-bundle

      - name: Install Chromium
        working-directory: .
        run: npx --no-install playwright install --with-deps chromium

      - name: Verify guild schedule in a built browser session
        working-directory: apps/web
        shell: bash
        run: |
          set -Eeuo pipefail
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 8765 >"$RUNNER_TEMP/guild-schedule-next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail --silent --show-error --max-time 5 http://127.0.0.1:8765/events >/dev/null
          cd ../..
          xvfb-run --auto-servernum npm run smoke:guild-schedule -- --base-url=http://127.0.0.1:8765
          npm run smoke:events-public-ux -- --base-url=http://127.0.0.1:8765
