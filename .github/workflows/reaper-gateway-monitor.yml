name: Reaper Gateway health

on:
  workflow_dispatch:
    inputs:
      notification_test:
        description: Owner-approved deliberate failure to verify GitHub notifications
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: read

concurrency:
  group: reaper-gateway-health
  cancel-in-progress: false

jobs:
  health:
    if: github.repository == 'Mochirii-Wushu/Mochirii-Website' && github.ref == 'refs/heads/main' && vars.REAPER_GATEWAY_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Check reviewed default-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Deliberate notification test
        if: github.event_name == 'workflow_dispatch' && inputs.notification_test
        run: |
          echo "Owner-approved Reaper Gateway notification test; no provider mutation."
          exit 1
      - name: Read fixed public Gateway status
        run: node scripts/check-reaper-gateway-status.mjs
