name: Manual Lighthouse audit

on:
  workflow_dispatch:
    inputs:
      gallery_origin:
        description: Reviewed Vercel Preview or exact local Gallery origin
        required: true
        default: http://127.0.0.1:8765
        type: string
      allow_live_gallery_media_smoke_once:
        description: One approved production Gallery audit only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Gallery audit target
        id: gallery-target
        env:
          GALLERY_AUDIT_ORIGIN: ${{ inputs.gallery_origin }}
          MOCHIRII_ALLOW_LIVE_GALLERY_MEDIA_SMOKE_ONCE: ${{ inputs.allow_live_gallery_media_smoke_once }}
        run: |
          set -euo pipefail
          gallery_url="$(node scripts/resolve-gallery-lighthouse-url.mjs "$GALLERY_AUDIT_ORIGIN")"
          echo "url=$gallery_url" >> "$GITHUB_OUTPUT"
          if [[ "$GALLERY_AUDIT_ORIGIN" == "http://127.0.0.1:8765" ]]; then
            echo "local=true" >> "$GITHUB_OUTPUT"
          else
            echo "local=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build exact local Gallery audit target
        if: steps.gallery-target.outputs.local == 'true'
        run: npm --prefix apps/web run build

      - name: Run Lighthouse audits
        env:
          GALLERY_AUDIT_URL: ${{ steps.gallery-target.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p reports/lighthouse

          npx lighthouse "https://mochirii.com/" \
            --output=html --output=json \
            --output-path=reports/lighthouse/home \
            --chrome-flags="--headless --no-sandbox"

          npx lighthouse "https://mochirii.com/recruitment" \
            --output=html --output=json \
            --output-path=reports/lighthouse/recruitment \
            --chrome-flags="--headless --no-sandbox"

          local_server_pid=""
          if [[ "${{ steps.gallery-target.outputs.local }}" == "true" ]]; then
            npm --prefix apps/web run start -- --hostname 127.0.0.1 --port 8765 >reports/lighthouse/local-next.log 2>&1 &
            local_server_pid="$!"
            trap 'if [[ -n "$local_server_pid" ]]; then kill "$local_server_pid" 2>/dev/null || true; fi' EXIT
            for attempt in {1..60}; do
              if curl --fail --silent --show-error --output /dev/null "$GALLERY_AUDIT_URL"; then
                break
              fi
              if [[ "$attempt" == "60" ]]; then
                echo "Local Gallery audit target did not become ready." >&2
                exit 1
              fi
              sleep 1
            done
          fi

          npx lighthouse "$GALLERY_AUDIT_URL" \
            --output=html --output=json \
            --output-path=reports/lighthouse/gallery \
            --chrome-flags="--headless --no-sandbox"

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: reports/lighthouse/
