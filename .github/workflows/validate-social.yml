name: Validate Mochirii Social

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  PIXELFED_IMAGE: mochirii-pixelfed:production-check
  REGISTRY_IMAGE: ghcr.io/mochirii-wushu/mochirii-pixelfed-ops

jobs:
  validate-social-core:
    name: validate-social-core
    runs-on: ubuntu-24.04
    outputs:
      social_changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Social changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -Eeuo pipefail
          changed=false
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ || ! "$(git cat-file -t "$BASE_SHA" 2>/dev/null)" == "commit" ]]; then
            changed=true
          elif ! git diff --quiet "$BASE_SHA" "$GITHUB_SHA" -- \
            services/social \
            .github/workflows/validate-social.yml \
            .github/workflows/deploy-social-production.yml \
            .github/workflows/recover-social-production.yml \
            .github/workflows/verify-social-online-hosting.yml; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [[ "$changed" == false ]]; then
            echo "No Social-owned paths changed; the required context reports success without running Social tests."
          fi

      - name: Setup Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install Social Node dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: services/social
        run: npm ci

      - name: Rebuild and verify committed Social assets
        if: steps.changes.outputs.changed == 'true'
        working-directory: services/social
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run production
          git diff --exit-code -- \
            public/css \
            public/js \
            public/mix-manifest.json
          test -z "$(git ls-files --others --exclude-standard -- \
            public/css \
            public/js \
            public/mix-manifest.json)" || {
              echo "Social production assets include uncommitted generated files." >&2
              exit 1
            }

      - name: Setup PHP
        if: steps.changes.outputs.changed == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:2.10.2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Run Social readiness checks
        if: steps.changes.outputs.changed == 'true'
        working-directory: services/social
        run: npm run check:mochirii-ops

      - name: Exercise private-media state helpers and archive guards
        if: steps.changes.outputs.changed == 'true'
        run: sudo bash services/social/scripts/test-private-media-bootstrap-runtime.sh

      - name: Install Composer dependencies
        if: steps.changes.outputs.changed == 'true'
        working-directory: services/social
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        if: steps.changes.outputs.changed == 'true'
        working-directory: services/social
        run: |
          cp .env.testing .env
          php artisan key:generate
          php artisan passport:keys --force

      - name: Lint changed Social PHP files
        if: steps.changes.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -Eeuo pipefail
          changed_files=""
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'services/social/**/*.php')"
          fi
          if [[ -z "$changed_files" ]]; then
            changed_files="services/social/app/Services/AvatarUploadPolicy.php services/social/app/Jobs/AvatarPipeline/AvatarOptimize.php services/social/tests/Unit/AvatarUploadPolicyTest.php"
          fi
          for file in $changed_files; do
            [[ -f "$file" ]] || continue
            php -l "$file"
          done

      - name: Run targeted Social tests
        if: steps.changes.outputs.changed == 'true'
        working-directory: services/social
        run: >-
          php artisan test
          tests/Unit/AvatarUploadPolicyTest.php
          tests/Feature/RemoteOidcTest.php
          tests/Feature/LoginTest.php
          tests/Feature/CsrfBootstrapContractTest.php
          tests/Feature/HealthCheckTest.php
          tests/Feature/MochiriiBrandingTest.php
          tests/Feature/PublicPrivacyContractTest.php
          tests/Feature/RequestIdSourceContractTest.php
          tests/Feature/ReadinessBoundarySourceContractTest.php
          tests/Feature/RetiredAccountCreationBoundaryTest.php
          tests/Feature/PassportSurfaceBoundaryTest.php
          tests/Feature/ExceptionHandlerTest.php
          tests/Feature/RetiredSurfaceSourceContractTest.php
          tests/Feature/DisabledUpstreamServicesTest.php
          tests/Feature/MochiriiSocialSyncServiceTest.php
          tests/Feature/OAuthTokenRevocationTest.php
          tests/Feature/PrivateSocialBoundaryTest.php
          tests/Feature/PrivateMediaGatewayTest.php
          tests/Feature/PrivateMediaSourceContractTest.php

  validate-recovery-tools:
    name: recovery-tools-${{ matrix.architecture }}
    needs: validate-social-core
    if: needs.validate-social-core.outputs.social_changed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native recovery runner architecture
        env:
          RECOVERY_ARCHITECTURE: ${{ matrix.architecture }}
          RUNNER_ARCHITECTURE: ${{ runner.arch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          native_architecture="$(uname -m)"
          case "$RECOVERY_ARCHITECTURE:$RUNNER_ARCHITECTURE:$native_architecture" in
            amd64:X64:x86_64 | arm64:ARM64:aarch64)
              ;;
            *)
              echo "Unexpected recovery runner architecture: matrix=$RECOVERY_ARCHITECTURE runner=$RUNNER_ARCHITECTURE uname=$native_architecture" >&2
              exit 1
              ;;
          esac

      - name: Validate recovery shell
        env:
          RECOVERY_ARCHITECTURE: ${{ matrix.architecture }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n \
            services/social/scripts/install-pinned-recovery-tools.sh \
            services/social/scripts/install-production-backups.sh \
            services/social/scripts/install-production-caddy.sh \
            services/social/scripts/backup-production-runtime.sh \
            services/social/scripts/deploy-production-entrypoint.sh \
            services/social/scripts/deploy-production-runtime.sh \
            services/social/scripts/install-production-runtime.sh \
            services/social/scripts/install-production-deploy-runtime-update.sh \
            services/social/scripts/production-runtime-lib.sh \
            services/social/scripts/restore-production-entrypoint.sh \
            services/social/scripts/restore-production-runtime.sh \
            services/social/scripts/test-private-media-bootstrap-runtime.sh
          if [[ "$RECOVERY_ARCHITECTURE" == "amd64" ]]; then
            shellcheck \
              services/social/scripts/install-pinned-recovery-tools.sh \
              services/social/scripts/install-production-backups.sh \
              services/social/scripts/install-production-caddy.sh \
              services/social/scripts/backup-production-runtime.sh \
              services/social/scripts/deploy-production-entrypoint.sh \
              services/social/scripts/deploy-production-runtime.sh \
              services/social/scripts/install-production-runtime.sh \
              services/social/scripts/install-production-deploy-runtime-update.sh \
              services/social/scripts/production-runtime-lib.sh \
              services/social/scripts/restore-production-entrypoint.sh \
              services/social/scripts/restore-production-runtime.sh \
              services/social/scripts/test-private-media-bootstrap-runtime.sh
          fi

      - name: Install and exercise pinned recovery tools
        shell: bash
        run: |
          set -Eeuo pipefail
          test_directory="$RUNNER_TEMP/recovery-tools-smoke"
          tools_directory="$test_directory/bin"
          install -d -m 0700 "$test_directory"
          bash services/social/scripts/install-pinned-recovery-tools.sh "$tools_directory"

          [[ "$("$tools_directory/age" --version)" == "v1.3.1" ]]
          [[ "$("$tools_directory/age-keygen" --version)" == "v1.3.1" ]]
          rclone_version_output="$("$tools_directory/rclone" version)"
          [[ "${rclone_version_output%%$'\n'*}" == "rclone v1.74.4" ]]

          printf '%s\n' 'Mochirii recovery tool smoke payload' > "$test_directory/payload"
          "$tools_directory/age-keygen" --output "$test_directory/identity" >/dev/null 2>&1
          recipient="$("$tools_directory/age-keygen" -y "$test_directory/identity")"
          "$tools_directory/age" --recipient "$recipient" \
            --output "$test_directory/payload.age" "$test_directory/payload"
          "$tools_directory/age" --decrypt --identity "$test_directory/identity" \
            --output "$test_directory/recovered" "$test_directory/payload.age"
          cmp --silent "$test_directory/payload" "$test_directory/recovered"

          rclone_root=":local:$test_directory/rclone-local"
          rclone_object="recovery-smoke.tar.age"
          "$tools_directory/rclone" --config /dev/null --quiet \
            copyto "$test_directory/payload.age" "$rclone_root/daily/$rclone_object"
          "$tools_directory/rclone" --config /dev/null --quiet \
            lsf --files-only "$rclone_root/daily" \
            | grep -Fxq "$rclone_object"
          cmp --silent \
            "$test_directory/payload.age" \
            "$test_directory/rclone-local/daily/$rclone_object"
          "$tools_directory/rclone" --config /dev/null --quiet \
            deletefile "$rclone_root/daily/$rclone_object"
          test ! -e "$test_directory/rclone-local/daily/$rclone_object"

  validate-social:
    name: validate-social
    needs: [validate-social-core, validate-recovery-tools]
    if: always()
    runs-on: ubuntu-24.04
    outputs:
      social_changed: ${{ steps.result.outputs.social_changed }}

    steps:
      - name: Report required Social validation result
        id: result
        env:
          CORE_RESULT: ${{ needs.validate-social-core.result }}
          RECOVERY_RESULT: ${{ needs.validate-recovery-tools.result }}
          SOCIAL_CHANGED: ${{ needs.validate-social-core.outputs.social_changed }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CORE_RESULT" == "success" ]] || {
            echo "Social core validation did not succeed." >&2
            exit 1
          }
          case "$SOCIAL_CHANGED" in
            true)
              [[ "$RECOVERY_RESULT" == "success" ]] || {
                echo "Recovery-tool validation did not succeed for a Social change." >&2
                exit 1
              }
              ;;
            false)
              [[ "$RECOVERY_RESULT" == "skipped" ]] || {
                echo "Recovery-tool validation must be skipped when Social paths are unchanged." >&2
                exit 1
              }
              ;;
            *)
              echo "Social change detection did not produce a valid result." >&2
              exit 1
              ;;
          esac
          echo "social_changed=$SOCIAL_CHANGED" >> "$GITHUB_OUTPUT"

  production-image:
    name: production-image
    needs: validate-social
    if: needs.validate-social.outputs.social_changed == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Verify and install Social build tools
        run: bash scripts/install-verified-social-build-tools.sh

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          driver-opts: |
            image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Build production image
        working-directory: services/social
        env:
          BUILD_CACHE_FROM: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
        run: bash scripts/build-production-image.sh

      - name: Verify production Composer dependencies
        run: >-
          docker run --rm --entrypoint php
          "$PIXELFED_IMAGE"
          scripts/check-production-composer-dependencies.php

      - name: Verify clean MariaDB migrations and workers
        working-directory: services/social
        run: bash scripts/check-clean-database-migrations.sh

      - name: Generate production image SBOM
        shell: bash
        run: |
          set -Eeuo pipefail
          SYFT_CHECK_FOR_APP_UPDATE=false \
            syft "$PIXELFED_IMAGE" -o spdx-json=pixelfed-sbom.spdx.json
          test -s pixelfed-sbom.spdx.json

      - name: Upload production image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixelfed-sbom-${{ github.sha }}
          path: pixelfed-sbom.spdx.json
          if-no-files-found: error

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io || true

  publish-social-image:
    name: publish-social-image
    needs: validate-social
    if: needs.validate-social.outputs.social_changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Verify and install Social build tools
        run: bash scripts/install-verified-social-build-tools.sh

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false
          driver-opts: |
            image=moby/buildkit:v0.31.2@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Build production image
        working-directory: services/social
        env:
          BUILD_CACHE_FROM: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache
          BUILD_CACHE_TO: type=registry,ref=${{ env.REGISTRY_IMAGE }}:buildcache,mode=max
        run: bash scripts/build-production-image.sh

      - name: Verify production Composer dependencies
        run: >-
          docker run --rm --entrypoint php
          "$PIXELFED_IMAGE"
          scripts/check-production-composer-dependencies.php

      - name: Verify clean MariaDB migrations and workers
        working-directory: services/social
        run: bash scripts/check-clean-database-migrations.sh

      - name: Generate production image SBOM
        shell: bash
        run: |
          set -Eeuo pipefail
          SYFT_CHECK_FOR_APP_UPDATE=false \
            syft "$PIXELFED_IMAGE" -o spdx-json=pixelfed-sbom.spdx.json
          test -s pixelfed-sbom.spdx.json

      - name: Publish immutable and main tags
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          resolve_digest() {
            local image_ref="$1"
            local digest=""
            for _ in {1..6}; do
              digest="$(docker buildx imagetools inspect "$image_ref" 2>/dev/null | awk '/^Digest:/ { print $2; exit }')"
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                printf '%s\n' "$digest"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          immutable_tag="$REGISTRY_IMAGE:$GITHUB_SHA"
          main_tag="$REGISTRY_IMAGE:main"
          docker tag "$PIXELFED_IMAGE" "$immutable_tag"
          docker push "$immutable_tag"
          digest="$(resolve_digest "$immutable_tag")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          docker tag "$PIXELFED_IMAGE" "$main_tag"
          docker push "$main_tag"
          main_digest="$(resolve_digest "$main_tag")"
          [[ "$main_digest" == "$digest" ]]

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`$REGISTRY_IMAGE@$digest\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Attest production image provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest production image SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: pixelfed-sbom.spdx.json
          push-to-registry: true

      - name: Upload production image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixelfed-sbom-${{ github.sha }}
          path: pixelfed-sbom.spdx.json
          if-no-files-found: error

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io || true
