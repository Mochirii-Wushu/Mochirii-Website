name: Verify or restore Mochirii Social backup

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate in isolation, or restore production
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - restore-production
      confirmation:
        description: Type VERIFY social backup or RESTORE social.mochirii.com
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: social-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: social-recovery
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate recovery inputs
        env:
          OBJECT_KEY: ${{ secrets.BACKUP_RECOVERY_OBJECT_KEY }}
          RECOVERY_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$OBJECT_KEY" ]]
          [[ "$OBJECT_KEY" =~ ^(daily|weekly|monthly|manual)/[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9._-]+[.]tar[.]age$ ]]
          if [[ "$RECOVERY_MODE" == "validate-only" ]]; then
            [[ "$CONFIRMATION" == "VERIFY social backup" ]]
          else
            [[ "$RECOVERY_MODE" == "restore-production" ]]
            [[ "$CONFIRMATION" == "RESTORE social.mochirii.com" ]]
          fi

      - name: Install pinned recovery tools
        shell: bash
        run: |
          set -Eeuo pipefail
          recovery_tools="$RUNNER_TEMP/recovery-tools"
          bash services/social/scripts/install-pinned-recovery-tools.sh "$recovery_tools"
          printf '%s\n' "$recovery_tools" >> "$GITHUB_PATH"

      - name: Configure private recovery inputs
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$BACKUP_AGE_IDENTITY" ]]
          [[ "$BACKUP_S3_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$BACKUP_S3_ENDPOINT" =~ ^https://[a-z0-9-]+[.]digitaloceanspaces[.]com$ ]]
          install -d -m 0700 recovery
          printf '%s\n' "$BACKUP_AGE_IDENTITY" | tr -d '\r' > recovery/identity
          chmod 0600 recovery/identity
          {
            printf 'RCLONE_CONFIG_MOCHIRII_BACKUP_TYPE=s3\n'
            printf 'RCLONE_CONFIG_MOCHIRII_BACKUP_PROVIDER=DigitalOcean\n'
            printf 'RCLONE_CONFIG_MOCHIRII_BACKUP_ENV_AUTH=false\n'
            printf 'RCLONE_CONFIG_MOCHIRII_BACKUP_ACCESS_KEY_ID=%s\n' "$BACKUP_S3_ACCESS_KEY_ID"
            printf '%s=%s\n' 'RCLONE_CONFIG_MOCHIRII_BACKUP_SECRET_ACCESS_KEY' "$BACKUP_S3_SECRET_ACCESS_KEY"
            printf 'RCLONE_CONFIG_MOCHIRII_BACKUP_ENDPOINT=%s\n' "$BACKUP_S3_ENDPOINT"
            printf 'RCLONE_CONFIG_MOCHIRII_BACKUP_REGION=%s\n' "$BACKUP_S3_REGION"
          } >> "$GITHUB_ENV"

      - name: Download and decrypt recovery point
        env:
          OBJECT_KEY: ${{ secrets.BACKUP_RECOVERY_OBJECT_KEY }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source services/social/scripts/production-runtime-lib.sh
          [[ -n "$OBJECT_KEY" ]]
          [[ "$OBJECT_KEY" =~ ^(daily|weekly|monthly|manual)/[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9._-]+[.]tar[.]age$ ]]
          remote_object="MOCHIRII_BACKUP:$BACKUP_S3_BUCKET/$OBJECT_KEY"
          remote_metadata="recovery/remote-object-size.json"
          rclone_error="$(mktemp recovery/rclone-error.XXXXXX)"
          chmod 0600 "$rclone_error"
          trap 'rm -f -- "$rclone_error" "$remote_metadata"' EXIT
          if ! rclone --config /dev/null --quiet size --json --s3-no-check-bucket \
            "$remote_object" >"$remote_metadata" 2>"$rclone_error"; then
            echo "The private recovery object metadata could not be read." >&2
            exit 1
          fi
          remote_bytes="$(python3 - "$remote_metadata" \
            "$RECOVERY_ENCRYPTED_MAX_BYTES" <<'PY'
          import json
          import pathlib
          import sys

          metadata_path = pathlib.Path(sys.argv[1])
          maximum_bytes = int(sys.argv[2])
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          count = metadata.get("count")
          byte_count = metadata.get("bytes")
          if type(count) is not int or count != 1:
              raise SystemExit("The recovery object lookup did not resolve exactly one object.")
          if type(byte_count) is not int or not 0 < byte_count <= maximum_bytes:
              raise SystemExit("The encrypted recovery object exceeds its bounded transport limit.")
          print(byte_count)
          PY
          )"
          rm -f -- "$remote_metadata"
          if ! rclone --config /dev/null --quiet copyto --s3-no-check-bucket \
            "$remote_object" \
            recovery/recovery.tar.age 2>"$rclone_error"; then
            echo "The private recovery object could not be downloaded." >&2
            exit 1
          fi
          rm -f -- "$rclone_error"
          trap 'rm -f -- "$remote_metadata"' EXIT
          verify_bounded_encrypted_recovery_file \
            recovery/recovery.tar.age "$remote_bytes"
          plaintext_candidate="recovery/recovery.tar.candidate"
          if ! age --decrypt --identity recovery/identity recovery/recovery.tar.age \
            | head -c "$((RECOVERY_PAYLOAD_MAX_BYTES + 1))" \
              >"$plaintext_candidate"; then
            rm -f -- "$plaintext_candidate"
            echo "Recovery decryption failed within the bounded transport." >&2
            exit 1
          fi
          plaintext_bytes="$(stat -c '%s' "$plaintext_candidate")"
          [[ "$plaintext_bytes" -gt 0 && \
            "$plaintext_bytes" -le "$RECOVERY_PAYLOAD_MAX_BYTES" ]] || {
            rm -f -- "$plaintext_candidate"
            echo "The decrypted recovery payload exceeds its 512 MiB limit." >&2
            exit 1
          }
          mv -T "$plaintext_candidate" recovery/recovery.tar
          trap - EXIT

      - name: Validate payload and isolated restore
        shell: bash
        run: |
          set -Eeuo pipefail
          # Use the exact host restore parser and limits so isolated validation
          # cannot accept a payload that production would reject.
          source services/social/scripts/production-runtime-lib.sh
          install -d -m 0700 recovery/extracted
          extract_validated_recovery_payload recovery/recovery.tar recovery/extracted
          validate_recovery_payload_manifest recovery/extracted \
            recovery/extracted/validated.manifest
          recovery_format="$(sed -n 's/^format=//p' \
            recovery/extracted/validated.manifest)"
          recovery_commit="$(sed -n 's/^release_commit=//p' \
            recovery/extracted/validated.manifest)"
          install -d -m 0700 recovery/configuration
          validate_recovery_configuration_archive \
            recovery/extracted/configuration.tar.gz \
            "${RUNTIME_ROOT#/}" \
            "$recovery_commit" \
            "$recovery_format" \
            recovery/configuration
          validate_recovery_configuration_bindings \
            recovery/configuration \
            recovery/extracted/validated.manifest \
            "${RUNTIME_ROOT#/}"

          restore_password="$(od -An -N32 -tx1 /dev/urandom | tr -d ' \n')"
          docker run --detach --rm --name mochirii-recovery-verify \
            --network none \
            --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=640m \
            --env MARIADB_DATABASE=restore_check \
            --env MARIADB_ROOT_PASSWORD="$restore_password" \
            mariadb:11.4@sha256:a794d9eb009e20de605858a11f32f63b4075cbd197c650436f0e3b457e4caed7 \
            >/dev/null
          trap 'docker rm --force mochirii-recovery-verify >/dev/null 2>&1 || true' EXIT

          restore_ready=false
          for _ in {1..60}; do
            if docker exec --env MYSQL_PWD="$restore_password" \
              mochirii-recovery-verify mariadb --user=root --batch \
              --skip-column-names --execute='SELECT 1;' >/dev/null 2>&1; then
              restore_ready=true
              break
            fi
            sleep 2
          done
          [[ "$restore_ready" == true ]] || {
            echo "The isolated restore database did not become ready." >&2
            exit 1
          }
          gzip -dc recovery/extracted/database.sql.gz | docker exec --interactive \
            --env MYSQL_PWD="$restore_password" mochirii-recovery-verify \
            mariadb --user=root restore_check
          for table_name in users statuses media oauth_clients; do
            docker exec --env MYSQL_PWD="$restore_password" \
              mochirii-recovery-verify mariadb --user=root --batch \
              --skip-column-names restore_check \
              --execute="SELECT COUNT(*) FROM \`$table_name\`;" >/dev/null
          done

      - name: Configure restricted recovery SSH
        if: inputs.mode == 'restore-production'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SOCIAL_RECOVERY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SOCIAL_RECOVERY_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/social_recovery_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/social_recovery_key ~/.ssh/known_hosts

      - name: Restore production database
        if: inputs.mode == 'restore-production'
        env:
          RECOVERY_HOST: ${{ vars.SOCIAL_RECOVERY_HOST }}
          RECOVERY_USER: ${{ vars.SOCIAL_RECOVERY_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$RECOVERY_HOST" && -n "$RECOVERY_USER" ]]
          ssh \
            -i ~/.ssh/social_recovery_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$RECOVERY_USER@$RECOVERY_HOST" \
            'restore RESTORE_social.mochirii.com' \
            < recovery/recovery.tar

      - name: Clean up recovery material
        if: always()
        shell: bash
        run: |
          docker rm --force mochirii-recovery-verify >/dev/null 2>&1 || true
          rm -rf recovery ~/.ssh/social_recovery_key
