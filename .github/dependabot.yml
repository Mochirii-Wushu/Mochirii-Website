# Repository updates are reviewed and committed by the authenticated maintainer.
# Dependabot alerts remain enabled; routine version-update pull requests are disabled.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      root-production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      root-development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      web-production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      web-development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /apps/shopify-theme
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      theme-development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
